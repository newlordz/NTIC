<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NTIC Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003f87">
  <meta name="description" content="Ghana National Technical Innovation Championship -- compete, learn, and lead.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NTIC Portal">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- ═══════════════════════════════════════════════════════════
       PRE-BOOTSTRAP CINEMATIC SPLASH  ·  renders at 0ms
       ═══════════════════════════════════════════════════════════ -->
  <style>
    /* Full-screen overlay */
    #ntic-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 8, 22, 0.52);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    #ntic-splash.out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient glow blobs */
    .sp-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }
    .sp-glow-blue {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0, 63, 135, 0.5) 0%, transparent 70%);
      top: -100px; left: -120px;
      animation: spGlowDrift 7s ease-in-out infinite alternate;
    }
    .sp-glow-gold {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation: spGlowDrift 9s ease-in-out infinite alternate-reverse;
    }

    /* Glass card */
    .sp-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(165deg,
        rgba(12, 32, 90, 0.78) 0%,
        rgba(5, 14, 44, 0.85) 100%);
      backdrop-filter: blur(36px) saturate(1.3);
      -webkit-backdrop-filter: blur(36px) saturate(1.3);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 32px;
      padding: 44px 56px 36px;
      width: min(400px, 88vw);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        0 40px 90px rgba(0, 0, 0, 0.65),
        0 0 80px rgba(0, 63, 135, 0.22),
        0 0 140px rgba(212, 175, 55, 0.07);
    }
    /* Gold shimmer on top edge */
    .sp-card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(212, 175, 55, 0.95) 50%, transparent 100%);
      border-radius: 999px;
    }

    /* Icon wrap */
    .sp-icon-wrap {
      position: relative;
      width: 96px; height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    /* Slow orbit ring with trailing dot */
    .sp-orbit {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.15);
      animation: spOrbit 14s linear infinite;
    }
    .sp-orbit::after {
      content: '';
      position: absolute;
      top: -4px; left: calc(50% - 4px);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d4af37;
      box-shadow: 0 0 12px #d4af37, 0 0 28px rgba(212, 175, 55, 0.5);
    }
    /* Fast spinner ring */
    .sp-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #d4af37;
      border-right-color: rgba(212, 175, 55, 0.25);
      animation: spSpin 1.6s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    /* Shield badge */
    .sp-badge {
      width: 82px; height: 82px;
      border-radius: 24px;
      background: linear-gradient(150deg, #0c2d7a 0%, #091e58 45%, #060e34 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.6),
        0 0 36px rgba(212, 175, 55, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sp-badge svg {
      width: 42px; height: 42px;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.7));
    }

    /* Ghana flag stripe */
    .sp-flag {
      display: flex;
      gap: 2px;
      margin-bottom: 18px;
    }
    .sp-flag span {
      width: 18px; height: 4px;
      border-radius: 2px;
    }
    .sp-flag .f1 { background: #006b3f; }
    .sp-flag .f2 { background: #fcd116; }
    .sp-flag .f3 { background: #ce1126; }

    /* Title */
    .sp-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 35%, #d4af37 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
    }

    /* Separator */
    .sp-sep {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.28), transparent);
      margin-bottom: 24px;
    }

    /* Progress bar */
    .sp-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }
    .sp-bar-fill {
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: 999px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 63, 135, 0.5) 20%,
        #d4af37 55%,
        rgba(96, 165, 250, 0.8) 85%,
        transparent 100%);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.85);
      animation: spBeam 1.9s ease-in-out infinite;
    }

    /* Status chip */
    .sp-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(212, 175, 55, 0.9);
      background: rgba(212, 175, 55, 0.07);
      border: 1px solid rgba(212, 175, 55, 0.26);
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    .sp-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2), 0 0 12px #22c55e;
      animation: spDotPulse 1.6s ease-in-out infinite;
    }

    /* ── Keyframes ── */
    @keyframes spSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes spOrbit {
      to { transform: rotate(360deg); }
    }
    @keyframes spGlowDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 25px) scale(1.12); }
    }
    @keyframes spBeam {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(330%); }
    }
    @keyframes spDotPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2), 0 0 12px #22c55e; }
      50%       { opacity: 0.6; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.08), 0 0 6px #22c55e; }
    }
  </style>
</head>

<body>
  <!-- ── Premium Pre-Bootstrap Loading Splash ── -->
  <div id="ntic-splash">
    <div class="sp-glow sp-glow-blue"></div>
    <div class="sp-glow sp-glow-gold"></div>

    <div class="sp-card">
      <!-- Shield with orbit + spinner -->
      <div class="sp-icon-wrap">
        <div class="sp-orbit"></div>
        <div class="sp-ring"></div>
        <div class="sp-badge">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2563eb"/>
                <stop offset="100%" stop-color="#0f172a"/>
              </linearGradient>
            </defs>
            <path d="M12 2L3 6.5v5C3 16.64 7.02 21.21 12 22c4.98-.79 9-5.36 9-10.5v-5L12 2z"
              fill="url(#shieldGrad)" stroke="rgba(212,175,55,0.5)" stroke-width="0.4"/>
            <path d="M9.5 12.5l2 2 3.5-4" stroke="#f59e0b" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Ghana flag accent -->
      <div class="sp-flag">
        <span class="f1"></span>
        <span class="f2"></span>
        <span class="f3"></span>
      </div>

      <!-- Wordmark -->
      <div class="sp-title">NTIC Championship</div>

      <!-- Separator -->
      <div class="sp-sep"></div>

      <!-- Loading bar -->
      <div class="sp-bar">
        <div class="sp-bar-fill"></div>
      </div>

      <!-- Status chip -->
      <div class="sp-chip">
        <span class="sp-dot"></span>
        <span>Initializing Secure Workspace</span>
      </div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    (function () {
      function dismissAll() {
        var targets = [
          document.getElementById('ntic-splash'),
          document.getElementById('ntic-preboot-splash')
        ];
        var byClass = document.querySelectorAll('.ntic-splash-container');
        for (var i = 0; i < byClass.length; i++) {
          targets.push(byClass[i]);
        }
        for (var j = 0; j < targets.length; j++) {
          var el = targets[j];
          if (el) {
            el.classList.add('out');
            el.classList.add('ntic-splash-fadeout');
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            (function(item) {
              setTimeout(function () {
                if (item && item.parentNode) {
                  item.parentNode.removeChild(item);
                }
              }, 750);
            })(el);
          }
        }
      }
      window.__dismissNticSplash = dismissAll;
      if (document.readyState === 'complete') {
        setTimeout(dismissAll, 600);
      } else {
        window.addEventListener('load', function () {
          setTimeout(dismissAll, 600);
        });
      }
      setTimeout(dismissAll, 1200);
    })();
  </script>
</body>
</html>
