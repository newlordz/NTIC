<div class="profile-completion-page" [class.dark]="themeService.isDarkMode">
  <div class="pc-card">
    <button class="btn btn-subtle btn-sm" (click)="goBack()" style="margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;">
      <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
      <span>Back to {{ isSponsor ? 'Sponsor Portal' : isJudge ? 'Judge Panel' : 'Dashboard' }}</span>
    </button>
    
    <div class="pc-header">
      <div class="pc-icon">
        <span class="material-symbols-outlined">{{ profileIcon }}</span>
      </div>
      <h2>{{ profileHeading }} Profile & Account Settings</h2>
      <p>Welcome, {{ currentUser?.fullName }}. Manage your account information and preferences.</p>
    </div>

    <!-- Profile Photo -->
    <div class="pc-photo-section" *ngIf="currentUser?.role === 'student' || currentUser?.role === 'instructor' || currentUser?.role === 'school_admin'">
      <label class="photo-label">Profile Photo</label>
      <div class="photo-preview-wrapper">
        <div class="photo-preview" [style.background-image]="profilePhotoPreviewUrl ? ('url(' + profilePhotoPreviewUrl + ')') : 'none'">
          <span class="material-symbols-outlined" *ngIf="!profilePhotoFileId">person</span>
        </div>
        <div class="photo-actions">
          <input type="file" accept="image/*" (change)="onPhotoSelected($event)" #photoInput hidden>
          <button type="button" class="btn btn-subtle btn-sm" (click)="photoInput.click()" [disabled]="isSubmitting">
            <span class="material-symbols-outlined">photo_camera</span> {{ profilePhotoFileId ? 'Change Photo' : 'Add Photo' }}
          </button>
          <button type="button" class="btn btn-ghost btn-sm" (click)="removePhoto()" *ngIf="profilePhotoFileId" [disabled]="isSubmitting">
            <span class="material-symbols-outlined">delete</span> Remove
          </button>
        </div>
        <p class="photo-hint" *ngIf="saveError && saveError.includes('image')">{{ saveError }}</p>
      </div>
    </div>

    <div class="pc-form">
      <!-- Common fields -->
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-control" type="text" [(ngModel)]="profileForm.fullName" name="pcFullName" placeholder="Your full name">
      </div>

      <div class="form-group">
        <label class="form-label">{{ isJudge ? 'Court / Organization *' : 'Company / Organization *' }}</label>
        <input class="form-control" type="text" [(ngModel)]="profileForm.organization" name="pcOrg" [placeholder]="isJudge ? 'e.g., High Court of Judicature' : 'e.g., MTN Ghana Foundation'">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" [value]="currentUser?.email" disabled style="opacity:0.6;">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control" type="tel" [(ngModel)]="profileForm.phone" name="pcPhone" placeholder="Contact phone number">
        </div>
      </div>

      <!-- Judge-specific fields -->
      <ng-container *ngIf="isJudge">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Area of Expertise *</label>
            <select class="form-control form-select" [(ngModel)]="profileForm.expertise" name="pcExpertise">
              <option value="">Select expertise</option>
              <option value="Coding & Software Engineering">Coding & Software Engineering</option>
              <option value="Robotics & Embedded Systems">Robotics & Embedded Systems</option>
              <option value="AI & Data Science">AI & Data Science</option>
              <option value="Networking & Cybersecurity">Networking & Cybersecurity</option>
              <option value="Innovation & Product Design">Innovation & Product Design</option>
              <option value="General NTI">General NTI & Computational Thinking</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Years of Experience *</label>
            <select class="form-control form-select" [(ngModel)]="profileForm.experience" name="pcExperience">
              <option value="">Select experience level</option>
              <option value="1-3">1-3 years (Junior Industry Expert)</option>
              <option value="4-7">4-7 years (Mid-Level Professional)</option>
              <option value="8-12">8-12 years (Senior Lead / Academic)</option>
              <option value="13+">13+ years (Executive / Professor)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Bio / Professional Background</label>
          <textarea class="form-control" rows="3" [(ngModel)]="profileForm.bio" name="pcBio" placeholder="Brief summary of your academic background, engineering domain, or judging qualifications..."></textarea>
        </div>
      </ng-container>

      <!-- Sponsor-specific fields -->
      <ng-container *ngIf="isSponsor">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Industry Sector *</label>
            <select class="form-control form-select" [(ngModel)]="profileForm.sector" name="pcSector">
              <option value="">Select industry sector</option>
              <option value="Telecommunications">Telecommunications & Digital Services</option>
              <option value="Energy & Mining">Energy, Oil & Mining</option>
              <option value="Banking & Finance">Banking, Financial Services & FinTech</option>
              <option value="Technology">Software, IT & Technology</option>
              <option value="Manufacturing">Manufacturing & Engineering</option>
              <option value="Education">Education, Research & Academies</option>
              <option value="Healthcare">Healthcare & Biotechnology</option>
              <option value="NGO / Development">NGO, Non-Profit & Development</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">CSR Representative *</label>
            <input class="form-control" type="text" [(ngModel)]="profileForm.repName" name="pcRepName" placeholder="e.g. Dr. Efua Mensah">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Partnership Tier</label>
            <select class="form-control form-select" [(ngModel)]="profileForm.tier" name="pcTier">
              <option value="Platinum Partner">Platinum Partner (GH₵ 100,000+)</option>
              <option value="Gold Partner">Gold Partner (GH₵ 20,000 - 100,000)</option>
              <option value="Silver Partner">Silver Partner (GH₵ 5,000 - 20,000)</option>
              <option value="Bronze Partner">Bronze Partner (GH₵ 1,000 - 5,000)</option>
            </select>
          </div>
        </div>

        <!-- The "Estimated Support Amount" field and the entire Payment Mode &
             Remittance card (payment channel, bank, MoMo network, card name /
             number / expiry / CVV, cheque number, issuing bank, invoice email)
             were removed from here deliberately.

             saveDraft() spreads the whole profileForm into
             localStorage['ntic_drafts'], so a full card number and CVV were
             written to disk in cleartext -- readable by any XSS payload and
             never cleared on logout. Storing a CVV is prohibited outright, and
             none of this data was ever transmitted anywhere (no processor, no
             API call), so it carried real cardholder-data risk for no function.

             If sponsorship payment is added later it must use a payment
             provider's hosted fields or redirect, so card data never enters
             this application at all. -->
      </ng-container>

      <div class="pc-save-error" *ngIf="saveError">
        <span class="material-symbols-outlined">error</span>
        <span>{{ saveError }}</span>
      </div>

      <div class="pc-actions">
        <button class="btn btn-subtle" (click)="saveDraft()">
          <span class="material-symbols-outlined">bookmark</span> Save Draft
        </button>
        <button class="btn btn-primary" (click)="submitProfile()" [disabled]="isSubmitting" style="padding: 12px 24px;">
          <span *ngIf="!isSubmitting" style="display:flex;align-items:center;gap:8px;font-weight:700;">
            <span class="material-symbols-outlined">check_circle</span> Save & Update Profile
          </span>
          <span *ngIf="isSubmitting" style="display:flex;align-items:center;gap:8px;">
            <span class="spinner-inline"></span> Saving...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
