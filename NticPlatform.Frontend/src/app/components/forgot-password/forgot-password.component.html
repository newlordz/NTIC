<div class="fp-backdrop" [class.dark]="theme === 'dark'" (click)="close()">
  <div class="fp-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">

    <button type="button" class="fp-close" (click)="close()" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>

    <!-- Progress rail: which of the three steps we are on -->
    <div class="fp-rail" *ngIf="step !== 'done'">
      <div class="fp-rail-fill" [style.width.%]="stepIndex * 50"></div>
      <div class="fp-dot" [class.active]="stepIndex >= 0" [class.done]="stepIndex > 0"></div>
      <div class="fp-dot" [class.active]="stepIndex >= 1" [class.done]="stepIndex > 1"></div>
      <div class="fp-dot" [class.active]="stepIndex >= 2"></div>
    </div>

    <!-- The icon and copy animate in on every step change, because the *ngIf
         below re-creates the block and the CSS entrance animation replays. -->
    <div class="fp-head">
      <div class="fp-icon" [class.success]="step === 'done'">
        <span class="material-symbols-outlined">{{ stepIcon }}</span>
      </div>
      <h3>{{ heading }}</h3>
      <p>{{ subheading }}</p>
    </div>

    <form class="fp-body" (ngSubmit)="submit()">

      <div class="fp-step" *ngIf="step === 'email'">
        <label for="fpEmail">Email address</label>
        <div class="fp-input-wrap">
          <span class="material-symbols-outlined">alternate_email</span>
          <input id="fpEmail" type="email" name="fpEmail" [(ngModel)]="email"
                 placeholder="name@school.edu.gh" autocomplete="username" autofocus>
        </div>
      </div>

      <div class="fp-step" *ngIf="step === 'otp'">
        <label for="fpCode">Verification code</label>
        <div class="fp-input-wrap">
          <span class="material-symbols-outlined">password</span>
          <input id="fpCode" type="text" name="fpCode" [(ngModel)]="code" class="fp-code"
                 placeholder="000000" maxlength="10" inputmode="numeric"
                 autocomplete="one-time-code" autofocus>
        </div>
        <p class="fp-hint">The code expires in 10 minutes.</p>
      </div>

      <div class="fp-step" *ngIf="step === 'reset'">
        <label for="fpNew">New password</label>
        <div class="fp-input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input id="fpNew" [type]="isPasswordVisible ? 'text' : 'password'" name="fpNew"
                 [(ngModel)]="newPassword" placeholder="New password"
                 autocomplete="new-password" autofocus>
          <button type="button" class="fp-eye" (click)="isPasswordVisible = !isPasswordVisible" tabindex="-1">
            <span class="material-symbols-outlined">{{ isPasswordVisible ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <label for="fpConfirm" style="margin-top:12px;">Confirm new password</label>
        <div class="fp-input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input id="fpConfirm" [type]="isPasswordVisible ? 'text' : 'password'" name="fpConfirm"
                 [(ngModel)]="confirmPassword" placeholder="Repeat new password"
                 autocomplete="new-password">
        </div>
      </div>

      <div class="fp-step fp-done" *ngIf="step === 'done'">
        <p>Your password has been changed and every device has been signed out.</p>
      </div>

      <div class="fp-error" *ngIf="error">
        <span class="material-symbols-outlined">error_outline</span>
        <span>{{ error }}</span>
      </div>

      <button type="submit" class="fp-submit" [disabled]="busy">
        <ng-container *ngIf="!busy">
          <span>
            {{ step === 'email' ? 'Send code'
             : step === 'otp' ? 'Confirm code'
             : step === 'reset' ? 'Change password'
             : 'Back to sign in' }}
          </span>
          <span class="material-symbols-outlined">arrow_right_alt</span>
        </ng-container>
        <ng-container *ngIf="busy">
          <span class="fp-spinner"></span>
          <span>Please wait…</span>
        </ng-container>
      </button>

      <button type="button" class="fp-link" *ngIf="step !== 'done'" (click)="close()">
        Back to sign in
      </button>
    </form>

  </div>
</div>
