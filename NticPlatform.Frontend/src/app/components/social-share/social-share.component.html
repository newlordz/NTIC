<div class="social-share-bar" [class.compact]="compact">
  <!-- Mobile Native Share Button (Shown on mobile PWA / modern browsers supporting Web Share API) -->
  <button
    *ngIf="canNativeShare"
    type="button"
    class="share-btn native-btn"
    (click)="shareNative()"
    title="Share via device options"
    aria-label="Share via device options"
  >
    <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    <span class="share-label" *ngIf="!compact">Share</span>
  </button>

  <!-- WhatsApp Intent Link -->
  <button
    type="button"
    class="share-btn whatsapp-btn"
    (click)="shareWhatsApp($event)"
    title="Share to WhatsApp"
    aria-label="Share to WhatsApp"
  >
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.01-1.24-.74-.66-1.25-1.48-1.39-1.73-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.45-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.16 0-.43.06-.66.31-.23.25-.87.85-.87 2.08s.89 2.42 1.01 2.59c.13.17 1.76 2.68 4.26 3.76.6.26 1.06.41 1.42.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.22-.16-.47-.29"/>
    </svg>
    <span class="share-label" *ngIf="!compact">WhatsApp</span>
  </button>

  <!-- X (Twitter) Intent Link -->
  <button
    type="button"
    class="share-btn x-btn"
    (click)="shareX($event)"
    title="Share to X"
    aria-label="Share to X"
  >
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    <span class="share-label" *ngIf="!compact">X</span>
  </button>

  <!-- LinkedIn Intent Link -->
  <button
    type="button"
    class="share-btn linkedin-btn"
    (click)="shareLinkedIn($event)"
    title="Share to LinkedIn"
    aria-label="Share to LinkedIn"
  >
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.69 1.69 0 0 0 1.7-1.68A1.7 1.7 0 0 0 6.46 5.4a1.69 1.69 0 0 0-1.69 1.68c0 .93.76 1.68 1.69 1.68m1.39 9.74v-8.37H5.07v8.37h2.78z"/>
    </svg>
    <span class="share-label" *ngIf="!compact">LinkedIn</span>
  </button>

  <!-- Facebook Intent Link -->
  <button
    type="button"
    class="share-btn facebook-btn"
    (click)="shareFacebook($event)"
    title="Share to Facebook"
    aria-label="Share to Facebook"
  >
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/>
    </svg>
    <span class="share-label" *ngIf="!compact">Facebook</span>
  </button>

  <!-- Copy Link to Clipboard Button -->
  <button
    type="button"
    class="share-btn copy-btn"
    [class.copied]="copied"
    (click)="copyLink($event)"
    [title]="copied ? 'Link copied!' : 'Copy link to clipboard'"
    aria-label="Copy link to clipboard"
  >
    <!-- Checkmark icon when copied -->
    <svg *ngIf="copied" class="share-icon check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <!-- Link icon by default -->
    <svg *ngIf="!copied" class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
    </svg>
    <span class="share-label" *ngIf="!compact">{{ copied ? 'Copied!' : 'Copy' }}</span>
  </button>
</div>
