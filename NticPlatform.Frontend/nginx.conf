# Required for WebSocket proxying: translates the incoming Upgrade header into
# the correct Connection header. Must live outside `server` (http context);
# files in conf.d/ are included inside http, so this is the right place.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy the API to the backend. Without this every /api/* request falls
    # through to `try_files` below and returns index.html with HTTP 200 -- a
    # silent failure that surfaces as JSON parse errors rather than a 404.
    #
    # BACKEND_UPSTREAM_PLACEHOLDER is replaced at container start from the
    # BACKEND_URL environment variable (see the Dockerfile CMD). The default
    # below only works if the backend runs in this same container.
    location /api/ {
        proxy_pass http://BACKEND_UPSTREAM_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for the /api/ws real-time channel.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Service worker control files: NEVER cache long-term ──────────────
    # Angular emits ngsw-worker.js and ngsw.json WITHOUT a content hash, so the
    # `.js` rule below would have pinned them for a year. Returning visitors
    # could then never receive a new service worker or manifest, leaving them on
    # a stale build indefinitely while the API moved on.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # index.html must always be revalidated, otherwise a cached copy keeps
    # pointing at bundle filenames that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Content-hashed build output is safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|bin)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
