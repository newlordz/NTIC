  <!-- ═══════════════════════════════════════════════════════════
       PRE-BOOTSTRAP CINEMATIC SPLASH  ·  renders at 0ms
       ═══════════════════════════════════════════════════════════ -->
  <style>
    /* Full-screen overlay */
    #ntic-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 8, 22, 0.55);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    #ntic-splash.out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Ambient glow blobs */
    .sp-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }
    .sp-glow-blue {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0, 63, 135, 0.5) 0%, transparent 70%);
      top: -100px; left: -120px;
      animation: spGlowDrift 7s ease-in-out infinite alternate;
    }
    .sp-glow-gold {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation: spGlowDrift 9s ease-in-out infinite alternate-reverse;
    }

    /* Glass card */
    .sp-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(165deg,
        rgba(12, 32, 90, 0.78) 0%,
        rgba(5, 14, 44, 0.85) 100%);
      backdrop-filter: blur(36px) saturate(1.3);
      -webkit-backdrop-filter: blur(36px) saturate(1.3);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 32px;
      padding: 44px 56px 36px;
      width: min(400px, 88vw);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        0 40px 90px rgba(0, 0, 0, 0.65),
        0 0 80px rgba(0, 63, 135, 0.22),
        0 0 140px rgba(212, 175, 55, 0.07);
    }
    /* Gold shimmer on top edge */
    .sp-card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(212, 175, 55, 0.95) 50%, transparent 100%);
      border-radius: 999px;
    }

    /* Icon wrap */
    .sp-icon-wrap {
      position: relative;
      width: 96px; height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    /* Slow orbit ring with trailing dot */
    .sp-orbit {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.15);
      animation: spOrbit 14s linear infinite;
    }
    .sp-orbit::after {
      content: '';
      position: absolute;
      top: -4px; left: calc(50% - 4px);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d4af37;
      box-shadow: 0 0 12px #d4af37, 0 0 28px rgba(212, 175, 55, 0.5);
    }
    /* Fast spinner ring */
    .sp-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #d4af37;
      border-right-color: rgba(212, 175, 55, 0.25);
      animation: spSpin 1.6s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    /* Shield badge */
    .sp-badge {
      width: 82px; height: 82px;
      border-radius: 24px;
      background: linear-gradient(150deg, #0c2d7a 0%, #091e58 45%, #060e34 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.6);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.6),
        0 0 36px rgba(212, 175, 55, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sp-badge svg {
      width: 42px; height: 42px;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.7));
    }

    /* Ghana flag stripe */
    .sp-flag {
      display: flex;
      gap: 2px;
      margin-bottom: 18px;
    }
    .sp-flag span {
      width: 18px; height: 4px;
      border-radius: 2px;
    }
    .sp-flag .f1 { background: #006b3f; }
    .sp-flag .f2 { background: #fcd116; }
    .sp-flag .f3 { background: #ce1126; }

    /* Title */
    .sp-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 35%, #d4af37 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
    }

    /* Separator */
    .sp-sep {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.28), transparent);
      margin-bottom: 24px;
    }

    /* Progress bar */
    .sp-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }
    .sp-bar-fill {
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: 999px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 63, 135, 0.5) 20%,
        #d4af37 55%,
        rgba(96, 165, 250, 0.8) 85%,
        transparent 100%);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.85);
      animation: spBeam 1.9s ease-in-out infinite;
    }

    /* Status chip */
    .sp-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(212, 175, 55, 0.9);
      background: rgba(212, 175, 55, 0.07);
      border: 1px solid rgba(212, 175, 55, 0.26);
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    .sp-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2), 0 0 12px #22c55e;
      animation: spDotPulse 1.6s ease-in-out infinite;
    }

    /* ── Keyframes ── */
    @keyframes spSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes spOrbit {
      to { transform: rotate(360deg); }
    }
    @keyframes spGlowDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 25px) scale(1.12); }
    }
    @keyframes spBeam {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(330%); }
    }
    @keyframes spDotPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2), 0 0 12px #22c55e; }
      50%       { opacity: 0.6; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.08), 0 0 6px #22c55e; }
    }
  </style>

  <div id="ntic-splash">
    <div class="sp-glow sp-glow-blue"></div>
    <div class="sp-glow sp-glow-gold"></div>

    <div class="sp-card">
      <!-- Shield with orbit + spinner -->

        </div>
      </div>

      <!-- Loading bar -->
      <div class="sp-bar">
        <div class="sp-bar-fill"></div>
      </div>

      <!-- Status chip -->
      <div class="sp-chip">
        <span class="sp-dot"></span>
        <span>Initializing Secure Workspace</span>
      </div>
    </div>
  </div>

  <!-- Pre-Bootstrap Dynamic Copy Hydration (0ms) -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('landingCopy');
        if (raw) {
          var copy = JSON.parse(raw);
          if (copy && copy['splash.wordmark']) {
            var t = document.querySelector('#ntic-splash .sp-title');
            if (t) t.textContent = copy['splash.wordmark'];
          }
          if (copy && copy['splash.status']) {
            var s = document.querySelector('#ntic-splash .sp-chip span:last-child');
            if (s) s.textContent = copy['splash.status'];
          }
        }
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      function dismissAll() {
        var targets = [
          document.getElementById('ntic-splash'),
          document.getElementById('ntic-preboot-splash')
        ];
        var byClass = document.querySelectorAll('.ntic-splash-container');
        for (var i = 0; i < byClass.length; i++) {
          targets.push(byClass[i]);
        }
        for (var j = 0; j < targets.length; j++) {
          var el = targets[j];
          if (el) {
            el.classList.add('out');
            el.classList.add('ntic-splash-fadeout');
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            (function(item) {
              setTimeout(function () {
                if (item && item.parentNode) {
                  item.parentNode.removeChild(item);
                }
              }, 750);
            })(el);
          }
        }
      }
      window.__dismissNticSplash = dismissAll;

      // AppComponent performs the real dismissal the moment the first route has
      // painted (see dismissSplash() in app.component.ts) and sets
      // __nticAppReady. The timers below are failure-mode nets only, for when
      // Angular never boots at all (broken chunk, uncaught error) -- otherwise
      // the user would stare at the splash forever. They are deliberately
      // generous: the previous 600ms/1200ms timers fired before the app had
      // painted on slow machines, which both flashed an empty page and made the
      // splash look like it was the thing being slow.
      function dismissIfAppNeverBooted() {
        if (!window.__nticAppReady) { dismissAll(); }
      }
      window.addEventListener('load', function () {
        setTimeout(dismissIfAppNeverBooted, 4000);
      });
      setTimeout(dismissIfAppNeverBooted, 10000);
    })();
  </script>
